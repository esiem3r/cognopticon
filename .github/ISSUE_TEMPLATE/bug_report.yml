name: Bug report
description: Report reproducible behavior without exposing private workspace data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Do not include `.cognopticon/` state, daemon tokens, private paths, local workspace JSON, secret logs, or screenshots that reveal private project names.

        If this is a vulnerability report, stop here and follow `SECURITY.md`. Use private vulnerability reporting when it is enabled; otherwise use the security coordination form without exploit details.
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy check
      options:
        - label: I removed private workspace data, daemon tokens, private paths, and secrets from this report.
          required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Public demo
        - Local runtime
        - Daemon
        - Release gate
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use sanitized paths such as `/demo/example` when possible.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node version, browser, and relevant command output.
      render: text
    validations:
      required: true
